<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="TrackPack · control de bultos entregados">
  <!-- App privada: que los buscadores no la indexen -->
  <meta name="robots" content="noindex, nofollow">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="TrackPack">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>TrackPack</title>
  <link rel="manifest" href="manifest.json">

  <!-- Descargas en paralelo desde el primer momento (antes esperaban a que
       terminara de cargar la anterior). Chrome y Edge usan la versión
       WebAssembly (arranca unas 3 veces más rápido); Safari y Firefox, la
       JavaScript. La comprobación es la misma que hace flutter.js. -->
  <script>
    (function () {
      var wasm = false;
      try {
        var chromium = navigator.vendor === 'Google Inc.' || navigator.userAgent.indexOf('Edg/') >= 0;
        var gc = new Uint8Array([0, 97, 115, 109, 1, 0, 0, 0, 1, 5, 1, 95, 1, 120, 0]);
        wasm = chromium && typeof WebAssembly !== 'undefined' && WebAssembly.validate(gc);
      } catch (e) {}
      var archivos = wasm
        ? [['main.dart.wasm', 'fetch'], ['main.dart.mjs', 'modulepreload']]
        : [['main.dart.js', 'script']];
      archivos.forEach(function (a) {
        var l = document.createElement('link');
        l.href = a[0];
        if (a[1] === 'modulepreload') {
          l.rel = 'modulepreload';
        } else {
          l.rel = 'preload';
          l.as = a[1];
          if (a[1] === 'fetch') l.crossOrigin = 'anonymous';
        }
        document.head.appendChild(l);
      });
    })();
  </script>
  <link rel="preload" href="assets/FontManifest.json" as="fetch" crossorigin>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Pantalla de carga: se ve al instante (sin esperar a la app) y la quita
       la app al dibujar su primera pantalla -->
  <style>
    html, body { margin: 0; height: 100%; background: #ffffff; }
    #carga {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #111111; background: #ffffff; z-index: 10;
    }
    #carga .marca { font-size: 26px; font-weight: 600; letter-spacing: .3px; }
    #carga .rueda {
      width: 34px; height: 34px; border-radius: 50%;
      border: 4px solid #f5c6c4; border-top-color: #E10600;
      animation: girar .8s linear infinite;
    }
    @keyframes girar { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="carga" aria-label="Cargando TrackPack">
    <svg width="56" height="56" viewBox="0 0 24 24" aria-hidden="true">
      <path fill="#E10600" d="M20 2H4c-1 0-2 .9-2 2v3.01c0 .72.43 1.34 1 1.69V20c0 1.1 1.1 2 2 2h14c.9 0 2-.9 2-2V8.7c.57-.35 1-.97 1-1.69V4c0-1.1-1-2-2-2zm-1 18H5V9h14v11zm1-13H4V4h16v3zM9 12h6v2H9z"/>
    </svg>
    <div class="marca">TrackPack</div>
    <div class="rueda"></div>
  </div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
